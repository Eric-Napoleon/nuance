<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161e2e"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>

  <!-- Glowing Emblem / The Stylized 'N' & Spark -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Main Left Stem -->
    <path d="M 40 40 L 40 280 C 40 293 51 304 64 304 L 80 304 C 93 304 104 293 104 280 L 104 135 L 210 294 C 218 306 232 312 246 308 C 255 305 260 297 260 288 L 260 40 C 260 27 249 16 236 16 L 220 16 C 207 16 196 27 196 40 L 196 185 L 90 26 C 82 14 68 8 54 12 C 45 15 40 23 40 40 Z" fill="url(#brandGrad)"/>
    
    <!-- Spark Star Accent (Elevated Thought) -->
    <path d="M 270 20 Q 270 50 300 50 Q 270 50 270 80 Q 270 50 240 50 Q 270 50 270 20 Z" fill="url(#accentGrad)"/>
  </g>
</svg>
