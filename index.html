<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nuance — Everyday Sophisticated Vocabulary</title>

  <!-- PWA & Mobile Web Meta -->
  <meta name="description" content="Master 10 nuanced, sophisticated words daily for natural everyday conversation.">
  <meta name="theme-color" content="#0a0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuance">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Sticky Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-logo">N</div>
        <span class="brand-name">Nuance</span>
      </div>

      <div class="header-controls">
        <div class="streak-badge" title="Daily Streak">
          <span>🔥</span>
          <span id="streak-count">1</span>
        </div>

        <button class="icon-btn theme-toggle-btn" id="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Dark/Light Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <!-- Main View 1: Daily 10 Words & Practice -->
    <main id="view-daily" class="tab-view active"></main>

    <!-- Main View 2: Daily Conversational Missions -->
    <section id="view-missions" class="tab-view"></section>

    <!-- Main View 3: Spaced Repetition Speed Quiz -->
    <section id="view-quiz" class="tab-view"></section>

    <!-- Main View 4: Word Vault & Personal Dictionary -->
    <section id="view-vault" class="tab-view"></section>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-tab="daily">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>Daily 10</span>
    </button>

    <button class="nav-tab" data-tab="missions">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span>Missions</span>
    </button>

    <button class="nav-tab" data-tab="quiz">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      <span>Review</span>
    </button>

    <button class="nav-tab" data-tab="vault">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
      <span>Vault</span>
    </button>
  </nav>

  <!-- Interactive Modal (Pack Selector, Custom Word, Install Guide) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Select Day</h3>
        <button id="modal-close-btn" class="modal-close-btn">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/words.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/drills.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Register Service Worker for offline PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('Nuance Service Worker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('Service Worker registration skipped/failed:', err);
        });
      });
    }
  </script>
</body>
</html>
